name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Github Packages
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image and push to GitHub Container Registry
        uses: docker/build-push-action@v7
        with:
          tags: |
            ghcr.io/akurin/morjoff-com-website-v2:latest
            ghcr.io/akurin/morjoff-com-website-v2:${{ github.sha }}
          push: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Set up SSH tunnel to k3s API server
        env:
          CI_DEPLOY_SSH_KEY: ${{ secrets.CI_DEPLOY_SSH_KEY }}
          K3S_HOST: ${{ secrets.K3S_HOST }}
        run: |
          echo "$CI_DEPLOY_SSH_KEY" > /tmp/ci_deploy_key
          chmod 600 /tmp/ci_deploy_key
          ssh -o StrictHostKeyChecking=accept-new -i /tmp/ci_deploy_key \
            -L 16443:127.0.0.1:6443 -N "ci-deploy@$K3S_HOST" &
          sleep 2

      - name: Set k8s context
        uses: Azure/k8s-set-context@v5
        with:
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Deploy to Kubernetes with Helm
        run: |
          helm upgrade --install --atomic \
            --set image.tag=${{ github.sha }} \
            morjoff-com-website helm --values helm/values.yaml
