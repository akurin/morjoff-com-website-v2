replicaCount: 1

image:
  repository: ghcr.io/akurin/morjoff-com-website-v2
  pullPolicy: IfNotPresent
  # CI deploys the commit's image (--set image.tag=<sha>); empty means the chart's appVersion.
  tag: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: morjoff.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: morjoff.com
      hosts:
        - morjoff.com

# nginx-unprivileged runs as uid 101 and only needs a writable /tmp.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
